# Integración continua (SRS §9.5, etapas 1 a 5 y 7).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21 con caché de Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Spotless + Checkstyle (validate), unitarias (surefire), integración con Testcontainers
      # (failsafe), ArchUnit y umbrales de JaCoCo (verify).
      - name: mvn verify
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore

      - name: Publicar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node LTS con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Formato (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Pruebas unitarias
        run: npm run test:ci
      - name: Build de producción
        run: npm run build

  e2e:
    name: E2E (Playwright)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node LTS con cache de npm
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restaurar cache de navegadores Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Instalar dependencias de frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Instalar Chromium, Firefox, WebKit y sus dependencias
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Levantar el stack
        env:
          # El stack E2E sirve HTTP en localhost; WebKit no acepta allí cookies Secure.
          REFRESH_COOKIE_SECURE: "false"
        run: docker compose --profile app up -d --build --wait

      - name: Ejecutar Playwright en todos los navegadores y viewports
        working-directory: frontend
        env:
          CI: true
          E2E_BASE_URL: http://localhost:4200
          MAILPIT_URL: http://localhost:8025
        run: npm run e2e

      - name: Publicar reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Apagar el stack
        if: always()
        run: docker compose --profile app down
