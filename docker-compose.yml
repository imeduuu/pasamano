# Entorno local de Trato (RNF-POR-01).
#   Infraestructura:         docker compose up -d
#   Todo (con backend+front): docker compose --profile app up --build
# Los valores por defecto son SOLO para desarrollo local; copia .env.example a .env para cambiarlos.
name: trato

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trato}
      POSTGRES_USER: ${POSTGRES_USER:-trato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trato}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO ya no publica imágenes comunitarias en Docker Hub; se usa la build de Chainguard.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trato-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trato-minio-dev}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Tarea única: crea el bucket privado de imágenes de publicaciones (ADR-006).
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-trato-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-trato-minio-dev}
      S3_BUCKET: ${S3_BUCKET:-listings}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET} &&
      echo 'Bucket listo' && touch /tmp/ready && sleep 2"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.34
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: 500
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    image: trato-backend:local
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trato}
      DB_USERNAME: ${POSTGRES_USER:-trato}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-trato}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-Trato <no-responder@trato.localhost>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-local-cambiar-en-demo-0123456789}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-listings}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-trato-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-trato-minio-dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_URL_EXPIRATION: ${S3_URL_EXPIRATION:-15m}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 10

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    image: trato-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      API_BASE_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
