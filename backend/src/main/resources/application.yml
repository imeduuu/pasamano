# Configuración común a todos los perfiles. Todo valor sensible o dependiente del entorno se
# lee desde variables de entorno (12-factor, RNF-POR-02). Los valores por defecto de desarrollo
# viven en application-local.yml.
spring:
  application:
    name: trato
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema solo cambia vía Flyway (RNF-MAN-04).
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  web:
    # Mensajes de validación en español de Chile (RNF-I18N-01, RNF-USA-04).
    locale: es_CL
    locale-resolver: fixed
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Respeta X-Forwarded-* del proxy (nginx) para obtener la IP real del cliente.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # El correo es asíncrono y con reintentos: su caída no debe sacar a la app de servicio.
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
  default-produces-media-type: application/json

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

trato:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  identity:
    jwt:
      # Clave HMAC de al menos 32 bytes. Sin valor por defecto fuera del perfil local.
      secret: ${JWT_SECRET}
      issuer: trato
      access-token-ttl: 15m
    refresh-cookie:
      name: trato_refresh
      path: /api/v1/auth
      secure: ${REFRESH_COOKIE_SECURE:true}
    legal:
      terms-version: "2026-11-20"
      privacy-version: "2026-11-20"
    login-rate-limit:
      capacity: 5
      period: 1m
  rate-limit:
    api:
      capacity: ${API_RATE_LIMIT_PER_MINUTE:100}
      period: 1m
  mail:
    from: ${MAIL_FROM:Trato <no-responder@trato.localhost>}
    retry:
      max-attempts: 3
      initial-delay: 2s
      multiplier: 2.0
  storage:
    s3:
      endpoint: ${S3_ENDPOINT}
      bucket: ${S3_BUCKET:listings}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      region: ${S3_REGION:us-east-1}
      url-expiration: ${S3_URL_EXPIRATION:15m}
